[project]
name = "pss"
version = "0.9.1"
description = "Pepe Silvia Search - Forward-only branching exploration for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "rich>=13.0.0",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.0",
    "ruff>=0.4",
]
mcp = [
    "mcp>=1.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pss = "pss.__main__:main"
pss-mcp = "pss.mcp_server:main"
pss-web = "pss.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
